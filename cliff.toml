# git-cliff configuration — drives the changelog + version bump for the release flow.
# The changelog format mirrors the previous release-plz template so CHANGELOG.md stays
# consistent across the tooling switch. See .github/workflows/release.yml.

[changelog]
header = """
# Changelog

All notable changes to Lin are documented here.
"""
body = """
## [{{ version | trim_start_matches(pat="v") }}]\
{% if previous and previous.version %}(https://github.com/Lin-Language/Lin/compare/{{ previous.version }}...{{ version }}){% endif %} - {{ timestamp | date(format="%Y-%m-%d") }}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}**: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"
commit_parsers = [
  { message = "^feat", group = "Features" },
  { message = "^fix", group = "Bug Fixes" },
  { message = "^perf", group = "Performance" },
  { message = "^docs", group = "Documentation" },
  { message = "^refactor", group = "Refactor" },
  { body = ".*BREAKING CHANGE.*", group = "Breaking Changes" },
  { message = "^.*!:", group = "Breaking Changes" },
  { message = "^chore", skip = true },
  { message = "^ci", skip = true },
  { message = "^test", skip = true },
  { message = "^style", skip = true },
  { message = ".*", group = "Other" },
]
